<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://api.iconify.design" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    /* ===== Navy and slate palette ===== */
    :root {
      --red: #1b2a41;        /* Navy (primary) */
      --gold: #c9a227;       /* Gold (accent) */
      --black: #000000;
      --charcoal: #1b2a41;   /* Navy (dark) */
      --smoke: #2c4361;      /* Slate navy */
      --white: #ffffff;
      --bg: #f5f7fa;
      --line: #dde3ea;
      --muted: #52606d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--charcoal);
      font-family: 'Inter', Arial, sans-serif; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* LOGO BAR */
    .brandbar {
      background: var(--white); text-align: center; padding: 18px 16px 14px;
      border-bottom: 3px solid var(--gold);
    }
    .brandbar img { height: 72px; width: auto; display: inline-block; }
    .wm {
      font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: .28em;
      font-size: 22px; color: var(--smoke); text-transform: uppercase;
    }

    /* HERO */
    .hero {
      background: linear-gradient(160deg, var(--charcoal), var(--smoke));
      color: var(--white); text-align: center;
      padding: 40px 24px 76px; border-radius: 0 0 28px 28px;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; width: 300px; height: 300px;
      right: -110px; top: -110px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201,162,39,.25), transparent 70%);
    }
    .avatar {
      width: 132px; height: 132px; border-radius: 50%; margin: 0 auto 16px;
      border: 4px solid var(--gold); object-fit: cover; display: block;
      background: var(--smoke); box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .avatar.initials {
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif; font-size: 42px; font-weight: 700; color: var(--gold);
    }
    h1 {
      font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 700;
      letter-spacing: .04em; margin: 0 0 8px; text-transform: uppercase;
    }
    .role {
      display: inline-block; font-size: 12px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--gold); font-weight: 600;
    }
    .tagline { margin: 14px auto 0; max-width: 480px; color: #d9d9d6; font-size: 15px; }
    .loc { margin-top: 10px; font-size: 13px; color: #b9b9b5; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }

    /* STATS */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px; margin: -42px 0 24px; position: relative; z-index: 2;
    }
    .stat {
      background: var(--white); border-radius: 14px; padding: 14px 8px;
      text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,.12);
      border-top: 4px solid var(--red);
    }
    .stat b { display: block; font-family: 'Montserrat', sans-serif; font-size: 24px; color: var(--red); }
    .stat span { font-size: 12px; color: var(--muted); }

    /* CARDS */
    .card {
      background: var(--white); border-radius: 16px; padding: 24px;
      margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }
    h2 {
      font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase; color: var(--charcoal);
      margin: 0 0 14px; display: flex; align-items: center; gap: 10px;
    }
    h2::before { content: ""; width: 24px; height: 3px; background: var(--red); border-radius: 2px; }
    p { margin: 0; }

    /* Justified paragraphs */
    .card p, ul.plain li, .job .desc, .job li {
      text-align: justify; text-justify: inter-word;
      -webkit-hyphens: none; hyphens: none;
    }

    /* phones: justified text leaves big gaps between words on narrow screens, so use normal left alignment */
    @media (max-width: 600px) {
      .card p, ul.plain li, .job .desc, .job li { text-align: left; }
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: #eef2f7; color: var(--charcoal); border: 1px solid var(--gold);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    }
    .chip.dark { background: var(--smoke); color: var(--white); border-color: var(--smoke); }

    /* tool logos */
    .logos { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    .logos.nolabel { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
    .tool {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
      background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px 10px;
      min-height: 84px; text-align: center; transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .logos.nolabel .tool { min-height: 60px; padding: 12px 6px; }
    .tool:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .tool img { width: 32px; height: 32px; object-fit: contain; display: block; }
    .tool .ini {
      width: 32px; height: 32px; border-radius: 8px; background: var(--smoke); color: var(--white);
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .tool span.nm { font-size: 11.5px; font-weight: 600; color: var(--charcoal); line-height: 1.25; overflow-wrap: anywhere; }

    /* TIMELINE */
    .tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 20px; }
    .job { position: relative; padding-bottom: 20px; }
    .job:last-child { padding-bottom: 0; }
    .job::before {
      content: ""; position: absolute; left: -27px; top: 6px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--red); border: 3px solid var(--white); box-shadow: 0 0 0 1px var(--red);
    }
    .job h3 { margin: 0; font-size: 16px; color: var(--charcoal); }
    .job .org { font-size: 14px; color: var(--red); font-weight: 600; }
    .job .per { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
    .job .desc { font-size: 14px; color: #3e4c59; }
    .job ul { margin: 6px 0 0; padding-left: 18px; }
    .job li { font-size: 14px; color: #3e4c59; margin-bottom: 4px; }
    .job li::marker { color: var(--red); }

    .hgroup + .hgroup { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .hlabel { font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 8px; }

    /* Photo viewer */
    .avatar.zoomable { cursor: zoom-in; transition: transform .2s; }
    .avatar.zoomable:hover { transform: scale(1.04); }
    .lightbox {
      position: fixed; inset: 0; z-index: 99; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(0,0,0,.88); cursor: zoom-out;
    }
    .lightbox.open { display: flex; animation: lbfade .25s ease both; }
    .lightbox img {
      max-width: 92vw; max-height: 86vh; border-radius: 16px;
      border: 3px solid var(--gold); box-shadow: 0 20px 60px rgba(0,0,0,.6);
      object-fit: contain; background: var(--smoke);
    }
    .lightbox .x {
      position: absolute; top: 14px; right: 18px; color: #fff; font-size: 34px;
      line-height: 1; font-family: Arial, sans-serif; opacity: .85;
    }
    .lbnav {
      display: none; position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--gold); cursor: pointer;
      background: rgba(27,42,65,.85); color: #fff; font-size: 28px; line-height: 1;
      align-items: center; justify-content: center; padding: 0 0 3px;
    }
    .lbnav:hover { background: var(--red); }
    .lbnav.prev { left: 12px; }
    .lbnav.next { right: 12px; }
    .lightbox.gallery .lbnav { display: flex; }
    .lbcap { display: none; position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; color: #fff; font-size: 14px; padding: 0 70px; text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none; }
    .lightbox.gallery .lbcap { display: block; }
    @keyframes lbfade { from { opacity: 0; } to { opacity: 1; } }

    /* Sample work carousel */
    .carousel { position: relative; }
    .track {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      border-radius: 12px;
    }
    .track::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; scroll-snap-align: center; margin: 0; min-width: 0; }
    .shot {
      background: #edf1f6; border: 1px solid var(--line); border-radius: 12px;
      aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .slide figcaption { padding: 0 4px; text-align: center; }
    .slide figcaption b { display: block; font-size: 16px; color: var(--charcoal); }
    .slide figcaption span { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
    .ctrl { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
    .nav {
      position: relative; flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      background: var(--charcoal); color: var(--gold); border: 1.5px solid var(--gold);
      font-size: 21px; line-height: 1; padding: 0 0 2px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s, opacity .15s;
    }
    .nav::after { content: ""; position: absolute; inset: -6px; }
    .nav.pp { padding: 0; background: #eef2f7; color: #000; border: 1.5px solid #000; }
    .nav.pp:hover:not(:disabled) { background: #fff; color: #000; border-color: #000; }
    .pp svg { display: block; }
    .nav:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }
    .nav:disabled { opacity: .35; cursor: default; }
    /* phones: arrows hidden (carousels and enlarged image), swiping and dots are enough */
    @media (max-width: 600px) { #prev, #next, #vprev, #vnext, #cprev, #cnext, #aprev, #anext, .lightbox.gallery .lbnav { display: none; } }
    .dots { display: flex; justify-content: center; align-items: center; gap: 8px; }
    .dots button {
      width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
      background: var(--line); transition: all .2s;
    }
    .dots button.on { background: var(--red); width: 22px; border-radius: 4px; }
    .hint { text-align: center !important; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .hint.note, .sample-note {
      display: block; max-width: 460px; margin: 10px auto 14px; padding: 0;
      font-size: 13px; font-weight: 600; line-height: 1.45; text-align: center !important;
      color: #8a6d12; background: none; border: 0;
    }
    .hint.note { margin: 12px auto 0; }
    .hint.note b { color: #8a6d12; }
    .hint.note .gear, .sample-note i { font-style: normal; color: #8a6d12; font-size: 14px; }
    .sample-note i { margin-right: 5px; }

    /* Video demos */
    .vcar .vmeta { text-align: center; }
    .player {
      position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
      background: linear-gradient(160deg, var(--charcoal), var(--smoke)); cursor: pointer;
    }
    .player img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player .shield { position: absolute; top: 0; right: 0; width: 72px; height: 64px; z-index: 5; background: transparent; }
    .play {
      position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
      border-radius: 50%; background: var(--red); box-shadow: 0 6px 20px rgba(0,0,0,.45);
      transition: transform .2s;
    }
    .play::after {
      content: ""; position: absolute; top: 50%; left: 50%; margin: -11px 0 0 -7px;
      border-style: solid; border-width: 11px 0 11px 19px; border-color: transparent transparent transparent #fff;
    }
    .player:hover .play { transform: scale(1.08); }
    .player.direct { cursor: default; }
    /* our own Enlarge button: sits over the Drive pop-out icon (hides it) and enlarges the video */
    .player .enl {
      position: absolute; top: 0; right: 0; z-index: 6; width: 64px; height: 56px; padding: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      background: #000; color: #fff; border: 0; border-bottom-left-radius: 12px;
    }
    .player .enl:hover { background: #1c1c1c; }
    .player .enl svg { display: block; }
    /* enlarged: real full screen when the browser allows it, otherwise a full-window view */
    .player.big { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; width: auto !important; height: auto !important; aspect-ratio: auto !important; border-radius: 0 !important; background: #000; }
    .player:fullscreen { width: 100% !important; height: 100% !important; aspect-ratio: auto !important; border-radius: 0 !important; background: #000; }
    .player:-webkit-full-screen { width: 100% !important; height: 100% !important; aspect-ratio: auto !important; border-radius: 0 !important; background: #000; }
    .player.big .edge, .player:fullscreen .edge, .player:-webkit-full-screen .edge { display: none !important; }
    .player.direct .play { display: none; }
    /* phones: side strips over the video so a swipe on the video still changes slides */
    /* phones: Google's player puts a black strip above the video; shift the player up so only the video shows */
    .player.clip:not(.big) iframe { top: -56px; height: calc(100% + 56px); }
    .player.clip:not(.big) .enl { top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.55); }
    .player.clip:not(.big) .enl:hover { background: rgba(0,0,0,.75); }
    .player.clip:not(.big) .enl svg { width: 18px; height: 18px; }
    .player .edge { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .player .edge { display: block; position: absolute; top: 64px; bottom: 56px; width: 14%; z-index: 4; background: transparent; }
      .player .edge.l { left: 0; }
      .player .edge.r { right: 0; }
      .player.clip .edge { top: 0; bottom: 64px; }
      /* bottom shield: Google's control bar (play/pause, time, settings) can't be shown or tapped in the normal view; they appear in the Enlarge view */
      .player .edge.b, .player.clip .edge.b { left: 0; right: 0; width: auto; top: auto; bottom: 0; height: 64px; }
    }
    .vmeta { padding: 0 4px; }
    .vmeta b { display: block; font-size: 16px; color: var(--charcoal); }
    .vmeta span { display: block; font-size: 14px; color: var(--muted); margin: 4px 0 0; }
    .vmeta a { font-size: 13px; font-weight: 600; color: var(--red); text-decoration: none; }
    .vmeta a:hover { text-decoration: underline; }

    .tgroup + .tgroup { margin-top: 14px; }
    .tlabel {
      font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }

    .edu b { display: block; font-size: 15px; color: var(--charcoal); }
    .edu span { font-size: 13px; color: var(--muted); }
    .subhead {
      margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line);
      font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
    .nw { white-space: nowrap; }
    .copy {
      display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
      width: 30px; height: 30px; margin: -4px 0 -4px 2px; padding: 0; border: 0; border-radius: 6px;
      background: none; color: var(--muted); cursor: pointer; position: relative;
    }
    .copy::after { content: ""; position: absolute; inset: -8px; }
    .copy:hover { color: var(--red); background: #eef2f7; }
    .copy .i-ok { display: none; }
    .copy.done { color: #2e7d32; }
    .copy.done .i-copy { display: none; }
    .copy.done .i-ok { display: inline; }
    /* certificates: list + small carousel side by side (stacked on phones) */
    .certwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (max-width: 640px) { .certwrap { grid-template-columns: minmax(0, 1fr); } }
    .ccar .track { border-radius: 10px; }
    .ccar .shot { aspect-ratio: 4 / 3; border-radius: 10px; background: #f8fafc; cursor: zoom-in; }
    .ccar .slide figcaption { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
    .ccar .slide figcaption b { font-size: 13px; }
    .ccar .ctrl { margin-top: 10px; gap: 10px; }
    .ccar .nav { width: 28px; height: 28px; font-size: 19px; }
    li.cert.has-img { cursor: pointer; }
    .ccar { width: 100%; max-width: 360px; justify-self: center; }
    li.cert.has-img:hover { color: var(--smoke); text-decoration: underline; text-decoration-color: var(--gold); }
    li.cert.on { font-weight: 600; }
    li.cert.on::marker { color: var(--gold); }
    ul.certs { margin: 0; }
    ul.certs li { text-align: left; }
    .cert { font-size: 14px; margin-bottom: 6px; }
    .cert span { color: var(--muted); font-size: 13px; }

    /* awards */
    ul.awards { list-style: none; margin: 0; padding: 0; }
    .award { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
    .award:first-child { padding-top: 0; }
    .award:last-child { border-bottom: 0; padding-bottom: 0; }
    .award .medal {
      flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: #fbf5e0; color: var(--gold); border: 1.5px solid var(--gold);
    }
    .award b { display: block; font-size: 14.5px; color: var(--charcoal); line-height: 1.35; }
    .award .ameta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    li.award.has-img { cursor: pointer; }
    li.award.has-img:hover b { text-decoration: underline; text-decoration-color: var(--gold); }
    li.award.on b { color: var(--smoke); }
    li.award.on .medal { background: var(--gold); color: #fff; }

    ul.plain { margin: 0; padding-left: 18px; }
    ul.plain li { margin-bottom: 6px; font-size: 14px; }
    ul.plain li::marker { color: var(--red); }

    /* CONTACT */
    .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    a.btn {
      display: block; text-align: center; text-decoration: none; padding: 13px 12px;
      border-radius: 10px; font-weight: 600; font-size: 14px;
      background: var(--red); color: var(--white); transition: transform .15s, background .15s;
    }
    a.btn:hover { transform: translateY(-2px); background: #0f1a2b; }
    a.btn.dark { background: var(--charcoal); }
    a.btn.dark:hover { background: var(--black); }
    a.btn.ghost { background: transparent; color: var(--charcoal); border: 1.5px solid var(--gold); }
    a.btn.ghost:hover { background: #eef2f7; }

    .act { min-width: 0; }
    .detail {
      margin-top: 6px; text-align: center; font-size: 12px; color: var(--muted);
      overflow-wrap: anywhere; line-height: 1.4;
    }

    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; text-transform: uppercase; letter-spacing: .08em; }
    .fcta { margin-top: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; text-align: center !important; color: #8a6d12; }
    .fcta a { color: #8a6d12; font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--gold); }
    .fcta a:hover { color: var(--gold); }

    .fade { animation: fade .6s ease backwards; }   /* backwards (not both): a leftover transform would trap full-screen video inside the card */
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ===== Enhancements ===== */
    html { scroll-behavior: smooth; }
    .skip {
      position: absolute; left: 8px; top: -60px; z-index: 200; background: var(--charcoal); color: #fff;
      padding: 10px 14px; border-radius: 8px; font-size: 14px; text-decoration: none;
    }
    .skip:focus { top: 8px; }
    :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
    .hero :focus-visible, .secnav :focus-visible, .lightbox :focus-visible { outline-color: var(--gold); }
    main { display: block; }
    .card, .stats, #skills { scroll-margin-top: 64px; }

    /* hero buttons */
    .hero-actions { position: relative; z-index: 1; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .hbtn {
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 999px;
      padding: 11px 20px; min-height: 44px; transition: transform .15s, background .15s;
    }
    .hbtn:hover { transform: translateY(-2px); }
    .hbtn.primary { background: var(--gold); color: var(--charcoal); border: 1.5px solid var(--gold); }
    .hbtn.primary:hover { background: #d9b94a; }
    .hbtn.ghost { background: transparent; color: #fff; border: 1.5px solid var(--gold); }
    .hbtn.ghost:hover { background: rgba(201,162,39,.18); }

    /* section menu: always visible, stays at the top while scrolling */
    .secnav {
      position: sticky; top: 0; z-index: 60; background: rgba(27,42,65,.97);
      border-bottom: 2px solid var(--gold);
    }
    .secnav-in {
      max-width: 760px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px;

        if (box.getAttribute('data-direct')) {
          if (box.classList.contains('big')) { box.classList.remove('big'); }
          box.querySelectorAll('iframe, .enl, .edge, .shield').forEach(function (n) { n.remove(); });
        } else if (box._orig) { box.innerHTML = box._orig; }
      }
      function stopAllVideos() {
        if (!vtrack) return;
        for (var i = 0; i < vtrack.children.length; i++) stopBox(vtrack.children[i].querySelector('.player'));
      }
      initCarousel('vtrack', 'vdots', 'vprev', 'vnext', function (cur) {
        var slides = vtrack.children;
        for (var i = 0; i < slides.length; i++) { if (i !== cur) stopBox(slides[i].querySelector('.player')); }
        if (vNear) ensureVideo(cur);
      });
      /* never keep playing in the background: leaving the screen, locking the phone or switching apps/tabs stops the video */
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopAllVideos(); else if (vNear) ensureVideo(curV());
      });
      window.addEventListener('pagehide', stopAllVideos);
      window.addEventListener('blur', function () { if (document.hidden) stopAllVideos(); });
      if (vtrack) {
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (es) {
            if (es[0].isIntersecting && !vNear) { vNear = true; ensureVideo(curV()); }
          }, { rootMargin: '300px' }).observe(vtrack);
          /* scrolled away from the videos -> stop; scrolled back -> player ready again */
          new IntersectionObserver(function (es) {
            if (!es[0].isIntersecting) { if (!document.querySelector('.player.big')) stopAllVideos(); }
            else if (vNear) ensureVideo(curV());
          }).observe(vtrack);
        } else { vNear = true; ensureVideo(0); }
      }
    })();

    }

    (function () {
      var KEY = 'profile:data:v1', boot = document.getElementById('boot'), app = document.getElementById('profileRoot');
      var started = false, startedAt = 0;
      function start(p) {
        if (started) return; started = true; startedAt = Date.now();
        document.title = (p.name || 'Profile') + (p.title ? ' | ' + p.title : '');
        app.innerHTML = renderPage(p);
        if (boot) boot.parentNode.removeChild(boot);
        initPage();
      }
      function failed() {
        if (started || !boot) return;
        boot.innerHTML = '<b>Profile unavailable</b><span>The page could not load right now. Please try again in a moment.</span>' +
          '<button type="button" onclick="location.reload()">Try again</button>';
      }
      function same(a, b) {
        function strip(o) { var c = {}; for (var k in o) if (k !== 'builtAt') c[k] = o[k]; return JSON.stringify(c); }
        return strip(a) === strip(b);
      }
      if (window.PROFILE_PRELOAD) return start(window.PROFILE_PRELOAD);   /* used for testing */
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
      if (cached && cached.name) start(cached);   /* repeat visit: show the saved copy instantly */
      if (!apiReady()) { if (!cached) failed(); return; }
      fetch(API_URL + '?format=json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (p) {
          if (!p || p.error || !p.name) { failed(); return; }
          try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {}
          if (!started) return start(p);
          /* the sheet changed since the saved copy: refresh now if the visitor has not started reading, else next visit */
          if (!same(cached, p) && Date.now() - startedAt < 5000 && window.scrollY < 80 && !document.querySelector('.open')) location.reload();
        })
        .catch(failed);
    })();
  </script>

</body>
